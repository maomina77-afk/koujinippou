<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工事日報（スマホ最適化版）</title>
    <style>
        :root { --primary-color: #3498db; --secondary-color: #2ecc71; --bg-color: #f4f7f6; --text-color: #333; --border-color: #ddd; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; line-height: 1.4; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 1.4em; color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        fieldset { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; padding: 12px; background-color: #fcfcfc; }
        legend { font-weight: bold; color: var(--primary-color); padding: 0 8px; font-size: 0.95em; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85em; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
        .worker-card { background: #fff; border: 1px solid #ced4da; padding: 12px; border-radius: 8px; margin-bottom: 15px; position: relative; }
        .worker-card .remove-btn { position: absolute; top: 5px; right: 5px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
        .summary-area { background: #eef7ff; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 0.9em; border: 1px solid #bde0ff; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .total-highlight { font-size: 1.1em; font-weight: bold; color: #e67e22; border-top: 1px solid #ccc; padding-top: 5px; margin-top: 5px; }
        button { cursor: pointer; }
        .btn-add { background-color: var(--secondary-color); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-size: 1em; margin-bottom: 10px; }
        .btn-submit { background-color: var(--primary-color); color: white; padding: 15px; border: none; border-radius: 6px; width: 100%; font-size: 1.2em; font-weight: bold; margin-top: 10px; }
        .btn-manage { background-color: #7f8c8d; color: white; padding: 10px; border: none; border-radius: 6px; width: 100%; font-size: 0.9em; margin-bottom: 10px; }
        .data-management { background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; border-radius: 8px; margin-top: 20px; }
        .btn-clear { background-color: #e74c3c; color: white; padding: 10px; border: none; border-radius: 6px; width: 100%; font-size: 1em; margin-bottom: 20px; }
        
        /* 追記用ボタンとモーダルのスタイル */
        .input-with-btn { display: flex; gap: 5px; margin-bottom: 10px; }
        .input-with-btn input { margin-bottom: 0; flex: 1; }
        .btn-append { background: #34495e; color: white; border: none; border-radius: 6px; padding: 0 15px; font-size: 0.9em; white-space: nowrap; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .modal-content { background: white; margin: 20% auto; padding: 20px; width: 90%; max-width: 400px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-title { margin-top: 0; font-size: 1.1em; color: var(--primary-color); border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .chip { display: inline-block; background: #e0e0e0; padding: 10px 15px; margin: 5px; border-radius: 20px; font-size: 0.95em; cursor: pointer; color: #333; border: 1px solid #ccc; }
        .chip:active { background: #ccc; }
        .btn-close-modal { background: #95a5a6; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-size: 1em; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>工事日報</h1>
    
    <div id="datalists-container"></div>

    <form id="dailyReportForm">
        <fieldset>
            <legend>基本情報</legend>
            <div class="flex-row">
                <div>
                    <label>日付</label>
                    <input type="date" name="date" id="today">
                </div>
                <div>
                    <label>天候</label>
                    <select name="weather">
                        <option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option>
                    </select>
                </div>
            </div>
            <label>工事名</label>
            <input type="text" name="const_name" list="list-const_name" placeholder="選択または入力">
        </fieldset>

        <fieldset>
            <legend>出面情報（業者・作業員）</legend>
            <div id="worker-container"></div>
            <button type="button" class="btn-add" onclick="addWorkerCard()">＋ 作業員・外注を追加</button>
            <div class="summary-area" id="summary-area">
                <div id="contractor-counts"></div>
                <div class="summary-item total-highlight">
                    <span>合計人数</span>
                    <span><span id="grand-total">0</span> 名</span>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>作業内容・使用資材</legend>
            <label>本日の作業内容</label>
            <div class="input-with-btn">
                <input type="text" name="work_details" placeholder="掘削など">
                <button type="button" class="btn-append" onclick="openCandidateModal(this, 'work_details', '作業内容の候補')">＋候補</button>
            </div>
            
            <label>使用重機・車両</label>
            <div class="input-with-btn">
                <input type="text" name="machines" placeholder="バックホウ1台など">
                <button type="button" class="btn-append" onclick="openCandidateModal(this, 'machines', '重機・車両の候補')">＋候補</button>
            </div>

            <label>使用資材</label>
            <div class="input-with-btn">
                <input type="text" name="materials" placeholder="RC-40 20m3">
                <button type="button" class="btn-append" onclick="openCandidateModal(this, 'materials', '資材の候補')">＋候補</button>
            </div>
        </fieldset>

        <fieldset>
            <legend>安全・指示事項</legend>
            <label>安全指示・ヒヤリハット</label>
            <div class="input-with-btn">
                <input type="text" name="safety" placeholder="声掛け徹底など">
                <button type="button" class="btn-append" onclick="openCandidateModal(this, 'safety', '安全指示の候補')">＋候補</button>
            </div>

            <label>指示・申し送り</label>
            <div class="input-with-btn">
                <input type="text" name="instructions" placeholder="明日は〇〇搬入">
                <button type="button" class="btn-append" onclick="openCandidateModal(this, 'instructions', '指示・申し送りの候補')">＋候補</button>
            </div>
        </fieldset>

        <button type="button" class="btn-submit" onclick="submitForm()">日報を送信・保存 (CSV)</button>
    </form>
    
    <button type="button" class="btn-clear" onclick="clearFormState()">入力内容をリセット (新規作成)</button>

    <div class="data-management">
        <h3 style="margin-top:0; font-size:1em; color:#856404;">入力候補の管理</h3>
        <p style="font-size:0.8em; color:#856404;">※日付・天候以外の全項目を候補として記憶・バックアップできます。</p>
        <button type="button" class="btn-manage" style="background-color:#f39c12;" onclick="saveCurrentToCandidates()">現在の全入力を候補に記憶する</button>
        <button type="button" class="btn-manage" onclick="exportCandidatesCSV()">候補リストをバックアップ (CSV出力)</button>
        <input type="file" id="importFile" accept=".csv" style="display:none;" onchange="importCandidatesCSV(event)">
        <button type="button" class="btn-manage" onclick="document.getElementById('importFile').click()">候補リストを復元 (CSV読込)</button>
        <button type="button" class="btn-manage" style="background-color:#c0392b; margin-bottom:0;" onclick="clearCandidates()">候補リストを初期化</button>
    </div>
</div>

<div id="candidateModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" class="modal-title">候補から追加</h3>
        <div id="candidateList"></div>
        <button type="button" class="btn-close-modal" onclick="closeCandidateModal()">閉じる</button>
    </div>
</div>

<script>
    const candidateFields = ['const_name', 'sub_name', 'worker_name', 'job_type', 'work_details', 'machines', 'materials', 'safety', 'instructions'];
    const appendableFields = ['job_type', 'work_details', 'machines', 'materials', 'safety', 'instructions'];
    const CANDIDATES_KEY = 'nippo_candidates_v3';
    const DRAFT_KEY = 'nippo_draft_v2';
    let candidatesData = {};
    let currentTargetInput = null;

    const datalistsContainer = document.getElementById('datalists-container');
    candidateFields.forEach(field => {
        candidatesData[field] = [];
        // 追記項目以外はサジェスト(datalist)を利用する
        if (!appendableFields.includes(field)) {
            datalistsContainer.insertAdjacentHTML('beforeend', `<datalist id="list-${field}"></datalist>`);
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        loadCandidatesFromLocal();
        loadFormState();
        document.getElementById('dailyReportForm').addEventListener('input', saveFormState);
        document.getElementById('dailyReportForm').addEventListener('change', saveFormState);
    });

    function saveFormState() {
        const formData = { workers: [] };
        ['date', 'weather', 'const_name', 'work_details', 'machines', 'materials', 'safety', 'instructions'].forEach(name => {
            const el = document.querySelector(`[name="${name}"]`);
            if(el) formData[name] = el.value;
        });
        document.querySelectorAll('.worker-card').forEach(card => {
            formData.workers.push({
                sub_name: card.querySelector('[name="sub_name"]').value,
                sub_tier: card.querySelector('[name="sub_tier"]').value,
                worker_name: card.querySelector('[name="worker_name"]').value,
                work_hours: card.querySelector('[name="work_hours"]').value,
                job_type: card.querySelector('[name="job_type"]').value
            });
        });
        localStorage.setItem(DRAFT_KEY, JSON.stringify(formData));
    }

    function loadFormState() {
        const saved = localStorage.getItem(DRAFT_KEY);
        if (saved) {
            const formData = JSON.parse(saved);
            ['date', 'weather', 'const_name', 'work_details', 'machines', 'materials', 'safety', 'instructions'].forEach(name => {
                if(formData[name]) document.querySelector(`[name="${name}"]`).value = formData[name];
            });
            if (formData.workers && formData.workers.length > 0) {
                document.getElementById('worker-container').innerHTML = '';
                formData.workers.forEach(w => addWorkerCard(w));
            } else {
                if(document.querySelectorAll('.worker-card').length === 0) addWorkerCard();
            }
        } else {
            document.getElementById('today').valueAsDate = new Date();
            addWorkerCard();
        }
        updateSummary();
    }

    function clearFormState() {
        if(confirm("入力中の内容をすべてリセットしますか？")){
            localStorage.removeItem(DRAFT_KEY);
            location.reload();
        }
    }

    function addWorkerCard(data = {}) {
        const container = document.getElementById('worker-container');
        const cardId = Date.now() + Math.random().toString(36).substr(2, 5);
        
        const cardHtml = `
            <div class="worker-card" id="card-${cardId}">
                <button type="button" class="remove-btn" onclick="removeCard('${cardId}')">✕</button>
                <div class="flex-row">
                    <div style="flex: 2;">
                        <label>業者名</label>
                        <input type="text" name="sub_name" list="list-sub_name" value="${data.sub_name || ''}" placeholder="業者名" oninput="updateSummary()">
                    </div>
                    <div style="flex: 1;">
                        <label>次</label>
                        <input type="number" name="sub_tier" value="${data.sub_tier || '1'}">
                    </div>
                </div>
                <div class="flex-row">
                    <div style="flex: 2;">
                        <label>氏名</label>
                        <input type="text" name="worker_name" list="list-worker_name" value="${data.worker_name || ''}" placeholder="作業員氏名" oninput="updateSummary()">
                    </div>
                    <div style="flex: 1;">
                        <label>実働(h)</label>
                        <input type="number" name="work_hours" value="${data.work_hours || '8'}" step="0.5">
                    </div>
                </div>
                <label>職種</label>
                <div class="input-with-btn">
                    <input type="text" name="job_type" value="${data.job_type || ''}" placeholder="土工・運転手など">
                    <button type="button" class="btn-append" onclick="openCandidateModal(this, 'job_type', '職種の候補')">＋候補</button>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
        updateSummary();
        saveFormState();
    }

    function removeCard(id) {
        const card = document.getElementById(`card-${id}`);
        if(card) card.remove();
        updateSummary();
        saveFormState();
    }

    function updateSummary() {
        const cards = document.querySelectorAll('.worker-card');
        const contractorCountsDiv = document.getElementById('contractor-counts');
        let totals = {}, grandTotal = 0;
        cards.forEach(card => {
            const nameInput = card.querySelector('input[name="sub_name"]').value.trim() || "未入力業者";
            totals[nameInput] = (totals[nameInput] || 0) + 1;
            grandTotal++;
        });
        contractorCountsDiv.innerHTML = '';
        for (let contractor in totals) {
            contractorCountsDiv.innerHTML += `<div class="summary-item"><span>${contractor}</span><span>${totals[contractor]} 名</span></div>`;
        }
        document.getElementById('grand-total').innerText = grandTotal;
    }

    function submitForm() {
        const getVal = (name) => {
            const el = document.querySelector(`[name="${name}"]`);
            return el ? el.value.replace(/\r?\n/g, ' ').replace(/"/g, '""') : "";
        };

        const date = getVal('date');
        const weather = getVal('weather');
        const constName = getVal('const_name');
        const workDetails = getVal('work_details');
        const machines = getVal('machines');
        const materials = getVal('materials');
        const safety = getVal('safety');
        const instructions = getVal('instructions');
        const total = document.getElementById('grand-total').innerText;

        let workerText = "";
        document.querySelectorAll('.worker-card').forEach(card => {
            const sub = card.querySelector('[name="sub_name"]').value || "";
            const worker = card.querySelector('[name="worker_name"]').value || "";
            if(sub || worker) workerText += `[${sub}:${worker}] `;
        });

        const csvHeader = "\uFEFF日付,天候,工事名,合計人数,作業内容,使用重機,使用資材,安全指示,申し送り,出面詳細\r\n";
        const csvRow = `"${date}","${weather}","${constName}","${total}","${workDetails}","${machines}","${materials}","${safety}","${instructions}","${workerText}"\r\n`;

        const blob = new Blob([csvHeader + csvRow], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `日報_${date}.csv`;
        link.click();
        
        saveCurrentToCandidates(true);
    }

    // --- モーダル（複数追記）関連 ---
    function openCandidateModal(btnElement, fieldKey, title) {
        currentTargetInput = btnElement.previousElementSibling;
        document.getElementById('modalTitle').innerText = title;
        
        const listDiv = document.getElementById('candidateList');
        listDiv.innerHTML = '';
        
        const candidates = candidatesData[fieldKey] || [];
        if(candidates.length === 0) {
            listDiv.innerHTML = '<p style="color:#666;">候補が登録されていません。<br>入力後に画面下の「現在の全入力を候補に記憶する」を押してください。</p>';
        } else {
            candidates.forEach(val => {
                const btn = document.createElement('span');
                btn.className = 'chip';
                btn.innerText = val;
                btn.onclick = () => appendToInput(val);
                listDiv.appendChild(btn);
            });
        }
        document.getElementById('candidateModal').style.display = 'block';
    }

    function closeCandidateModal() {
        document.getElementById('candidateModal').style.display = 'none';
        currentTargetInput = null;
    }

    function appendToInput(val) {
        if(currentTargetInput) {
            let currentVal = currentTargetInput.value.trim();
            if(currentVal) {
                // すでに入力されている場合は「、」で区切って追記
                currentTargetInput.value = currentVal + '、' + val;
            } else {
                currentTargetInput.value = val;
            }
            saveFormState();
        }
        closeCandidateModal();
    }

    // --- 候補管理 ---
    function loadCandidatesFromLocal() {
        const saved = localStorage.getItem(CANDIDATES_KEY);
        if (saved) candidatesData = JSON.parse(saved);
        updateDatalists();
    }

    function updateDatalists() {
        candidateFields.forEach(field => {
            if (!appendableFields.includes(field)) {
                const datalist = document.getElementById(`list-${field}`);
                if(datalist) {
                    datalistsContainer.removeChild(datalist);
                    const newList = document.createElement('datalist');
                    newList.id = `list-${field}`;
                    if(candidatesData[field]) {
                        candidatesData[field].forEach(val => {
                            const option = document.createElement('option');
                            option.value = val;
                            newList.appendChild(option);
                        });
                    }
                    datalistsContainer.appendChild(newList);
                }
            }
        });
    }

    function saveCurrentToCandidates(silent = false) {
        candidateFields.forEach(field => {
            if(!candidatesData[field]) candidatesData[field] = [];
            document.querySelectorAll(`[name="${field}"]`).forEach(input => {
                const valRaw = input.value.trim();
                if(valRaw) {
                    // 追記項目の場合、「、」や「,」で分割して別々に登録する
                    if (appendableFields.includes(field)) {
                        const splitVals = valRaw.split(/[、,]/).map(v => v.trim()).filter(v => v);
                        splitVals.forEach(v => {
                            if (!candidatesData[field].includes(v)) candidatesData[field].push(v);
                        });
                    } else {
                        if (!candidatesData[field].includes(valRaw)) candidatesData[field].push(valRaw);
                    }
                }
            });
        });
        localStorage.setItem(CANDIDATES_KEY, JSON.stringify(candidatesData));
        updateDatalists();
        if(!silent) alert("現在入力されている全項目を候補リストに記憶しました。");
    }

    function clearCandidates() {
        if(confirm("記憶している入力候補をすべて削除しますか？")){
            candidateFields.forEach(field => candidatesData[field] = []);
            localStorage.setItem(CANDIDATES_KEY, JSON.stringify(candidatesData));
            updateDatalists();
            alert("初期化しました。");
        }
    }

    function exportCandidatesCSV() {
        let csvContent = "\uFEFFカテゴリ,値\r\n";
        candidateFields.forEach(field => {
            if(candidatesData[field]) {
                candidatesData[field].forEach(val => {
                    csvContent += `"${field}","${val.replace(/"/g, '""')}"\r\n`;
                });
            }
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `入力候補バックアップ.csv`;
        link.click();
    }

    function importCandidatesCSV(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split(/\r?\n/);
            candidateFields.forEach(field => candidatesData[field] = []); 
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const match = line.match(/^"([^"]+)","(.*)"$/);
                if (match) {
                    const category = match[1];
                    const val = match[2];
                    if (candidatesData[category] && !candidatesData[category].includes(val)) {
                        candidatesData[category].push(val);
                    }
                }
            }
            localStorage.setItem(CANDIDATES_KEY, JSON.stringify(candidatesData));
            updateDatalists();
            alert("復元しました。");
            event.target.value = '';
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
